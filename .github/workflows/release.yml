name: Release (Windows, Linux & macOS)

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-matrix:
    name: Build ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pnpm run build:win
          - os: ubuntu-latest
            command: pnpm run build:linux
          - os: macos-latest
            command: pnpm run build:mac

    runs-on: ${{ matrix.os }}
    # Windows also uploads the Store package
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set release version
        run: npm pkg set version=${{ needs.release.outputs.new_release_version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick xz-utils

      - name: Build & Publish
        run: ${{ matrix.command }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_GDRIVE_CLIENT_ID: ${{ secrets.MAIN_VITE_GDRIVE_CLIENT_ID }}
          MAIN_VITE_GDRIVE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GDRIVE_CLIENT_SECRET }}

      # Microsoft Store package: kept out of the GitHub release, submitted to Partner Center below
      - name: Build Store package
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: pnpm exec electron-builder --win appx --publish never

      - name: Upload Store package
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: store-appx
          path: dist/*.appx

      - name: Setup Microsoft Store CLI
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: microsoft/microsoft-store-apppublisher@v1.4

      # Submits the package for certification; the artifact above is the manual fallback
      # msstore only picks up .msix files; an .appx is the same package format
      - name: Publish to Microsoft Store
        id: store
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $appx = (Get-Item dist/*.appx).FullName
          $msix = [IO.Path]::ChangeExtension($appx, ".msix")
          Copy-Item $appx $msix
          msstore publish $msix -id 9P12F6CZLBR0
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Warn about Store submission
        if: steps.store.outcome == 'failure'
        run: echo "::warning::Microsoft Store submission failed; upload the store-appx artifact in Partner Center"

  publish-release:
    name: Publish Release
    needs: [release, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        run: gh release edit v${{ needs.release.outputs.new_release_version }} --repo ${{ github.repository }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
