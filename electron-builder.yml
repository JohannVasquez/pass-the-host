appId: cl.jvdev.passthehost
productName: "Pass the host"
directories:
  buildResources: resources
files:
  - "out/**"
  - "node_modules/**"
  - "package.json"
asarUnpack:
  - resources/**
win:
  executableName: "Pass the host"
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: "Pass the host"
  uninstallDisplayName: "Pass the host"
  createDesktopShortcut: always
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
mac:
  icon: resources/icon.icns
  entitlementsInherit: build/entitlements.mac.plist

  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: "Pass the host"
      Comment: "Minecraft server manager using Cloudflare R2"
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  - provider: github
    owner: JohannVasquez
    repo: pass-the-host
    releaseType: release
