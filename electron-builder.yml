appId: cl.jvdev.passthehost
productName: "Pass the host"
directories:
  buildResources: resources
files:
  - "out/**"
  - "node_modules/**"
  - "package.json"
  - "resources/icon.png"
asarUnpack:
  - resources/**
win:
  executableName: "Pass the host"
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: "Pass the host"
  uninstallDisplayName: "Pass the host"
  createDesktopShortcut: always
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
# Microsoft Store package: identity values come from Partner Center → Product identity
appx:
  applicationId: PassTheHost
  displayName: "Pass the host"
  identityName: JohannV.Dev.Passthehost
  publisher: CN=95840A7B-6A6C-4FA6-BCFA-C147C7886902
  publisherDisplayName: "Johann V. Dev"
  # Partner Center rejects .msix packages targeting Windows 10 1803 (10.0.17134) or older
  minVersion: 10.0.17763.0
  languages:
    - en-US
    - es-ES
mac:
  icon: resources/icon.icns
  entitlementsInherit: build/entitlements.mac.plist

  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: "Pass the host"
      Comment: "Share a Minecraft server with friends, synced through your own cloud storage"
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
afterPack: build/adhoc-sign.mjs
publish:
  - provider: github
    owner: JohannVasquez
    repo: pass-the-host
    releaseType: release
